<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260">
  <!-- Old book leather, drawn by the browser (no photo to download): a pebbled grain lit from the upper left. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="8" stitchTiles="stitch" result="bumps"/>
    <feDiffuseLighting in="bumps" lighting-color="#fff" surfaceScale="1.8" result="lit">
      <feDistantLight azimuth="225" elevation="58"/>
    </feDiffuseLighting>
    <feColorMatrix in="lit" type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)"/>
</svg>
