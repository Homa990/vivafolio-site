<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260">
  <!-- The same pebbled leather as leather-grain.svg, already dyed oxblood inside the drawing (the grain is multiplied
       with #7A1F1A here), so phones never have to blend it themselves: iPhone Safari skips CSS background-blend-mode
       and showed the grain white. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="8" stitchTiles="stitch" result="bumps"/>
    <feDiffuseLighting in="bumps" lighting-color="#fff" surfaceScale="1.8" result="lit">
      <feDistantLight azimuth="225" elevation="58"/>
    </feDiffuseLighting>
    <feColorMatrix in="lit" type="saturate" values="0" result="grey"/>
    <feFlood flood-color="#7A1F1A" color-interpolation-filters="sRGB" result="dye"/>
    <feBlend in="grey" in2="dye" mode="multiply" color-interpolation-filters="sRGB"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)"/>
</svg>
